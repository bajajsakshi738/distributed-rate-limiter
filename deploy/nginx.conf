# nginx: plain round-robin load balancer in front of the 3 API instances.
#
# Deliberately NO ip_hash, hash or sticky sessions. With sticky routing each
# client would always hit the same instance, and the in-memory limiter bug
# (3 instances = 3x the limit) would never show up.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    client_max_body_size 1k;

    # Writable paths for the unprivileged image with a read-only filesystem.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The default log format records the request line but never headers, so
    # API keys (sent only in the Authorization header) are not logged.
    # Load tests would flood the log, so access logging is off.
    access_log off;
    error_log /dev/stderr warn;

    # These names are resolved once, when nginx starts. scripts/deploy.sh
    # restarts nginx after recreating the API containers for that reason.
    upstream api {
        server api-1:8080;
        server api-2:8080;
        server api-3:8080;
        keepalive 128;
    }

    server {
        listen 8080;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            # Retry on another instance only on "error": a failed connection,
            # or an instance that died before sending response headers. The
            # first case never reached a limiter. The second (an instance
            # crashing mid-request) could count one request on two instances;
            # rare, and accepted in exchange for not failing requests while an
            # instance restarts. Timeouts are never retried.
            proxy_next_upstream error;
        }

        location = /healthz {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # /metrics and /internal/* live on each instance's internal port
        # (9090), which nginx never proxies. Everything else is a 404.
        location / {
            return 404;
        }
    }
}
