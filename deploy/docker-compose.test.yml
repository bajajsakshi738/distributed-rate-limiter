# Throwaway Redis and Postgres for `make test-integration`.
name: ratelimiter-test

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]
    ports: ["127.0.0.1:6390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ratelimiter_test
    ports: ["127.0.0.1:5440:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20
