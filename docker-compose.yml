# Distributed rate limiter: 3 API instances behind nginx, sharing Redis, plus the dashboard.
#
#   Local:       docker compose up -d --build
#                dashboard  http://localhost:8000    API  http://localhost:8080/api/data
#   Production:  docker compose --profile prod up -d --build   (adds Caddy for HTTPS)
#
# Only Caddy (prod) is reachable from outside. Locally, nginx and the
# dashboard are published on 127.0.0.1 only. Postgres and Redis are never published.

name: distributed-rate-limiter

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-go-service: &go-service
  build: .
  image: distributed-rate-limiter:latest
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-api-env: &api-env
  KEY_SECRET: ${KEY_SECRET:?set KEY_SECRET in .env}
  DATABASE_URL: postgres://ratelimiter:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ratelimiter?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  LIMITER_STORE: ${LIMITER_STORE:-redis}
  INSTANCE_COUNT: "3"
  REDIS_TIMEOUT: 15ms

x-api: &api
  <<: *go-service
  command: ["/usr/local/bin/api"]
  networks: [internal]
  mem_limit: 128m
  cpus: 0.75
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "/usr/local/bin/api", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  api-1:
    <<: *api
    environment: { <<: *api-env, INSTANCE_ID: api-1 }
  api-2:
    <<: *api
    environment: { <<: *api-env, INSTANCE_ID: api-2 }
  api-3:
    <<: *api
    environment: { <<: *api-env, INSTANCE_ID: api-3 }

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal, edge]
    mem_limit: 64m
    logging: *logging
    depends_on:
      api-1: { condition: service_healthy }
      api-2: { condition: service_healthy }
      api-3: { condition: service_healthy }

  dashboard:
    <<: *go-service
    command: ["/usr/local/bin/dashboard"]
    environment:
      DATABASE_URL: postgres://ratelimiter:${POSTGRES_PASSWORD}@postgres:5432/ratelimiter?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LIMITER_STORE: ${LIMITER_STORE:-redis}
      KEY_SECRET: ${KEY_SECRET}
      DEMO_KEY: ${DEMO_KEY:-on}
      ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CSRF_SECRET: ${CSRF_SECRET:-}
      INSTANCE_URLS: http://api-1:9090,http://api-2:9090,http://api-3:9090
      LOADTEST_TARGET: http://nginx:8080/api/data
      LOADTEST_MAX_RPS: ${LOADTEST_MAX_RPS:-1000}
      LOADTEST_MAX_DURATION: ${LOADTEST_MAX_DURATION:-60s}
      LOADTEST_MAX_CLIENTS: ${LOADTEST_MAX_CLIENTS:-50}
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal, edge]
    mem_limit: 256m
    cpus: 1.0
    depends_on:
      nginx: { condition: service_started }
    healthcheck:
      test: ["CMD", "/usr/local/bin/dashboard", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Pure in-memory: limiter state is short-lived by design, nothing to persist.
    # Every limiter key has a TTL, so under memory pressure evict by TTL.
    command: >
      redis-server --requirepass "${REDIS_PASSWORD}" --save "" --appendonly no
      --maxmemory 64mb --maxmemory-policy volatile-ttl
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    networks: [internal]
    mem_limit: 128m
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ratelimiter
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 256m
    logging: *logging
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ratelimiter", "-d", "ratelimiter"]
      interval: 3s
      timeout: 2s
      retries: 20

  caddy:
    image: caddy:2-alpine
    profiles: [prod]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env for production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    mem_limit: 128m
    logging: *logging
    depends_on: [nginx, dashboard]

networks:
  # No internet access from this network: the API, Redis and Postgres can't
  # make outbound connections even if something goes wrong.
  internal:
    internal: true
  edge: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
