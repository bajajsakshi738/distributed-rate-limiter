name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ratelimiter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Integration tests (real Redis and Postgres)
        env:
          REDIS_ADDR: localhost:6379
          DATABASE_URL: postgres://postgres:test@localhost:5432/ratelimiter_test?sslmode=disable
        run: go test -tags integration -race -count=1 -v ./test/integration/

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.example .env && docker compose --profile prod config -q
      - name: Build image
        run: docker build -t distributed-rate-limiter:ci .
